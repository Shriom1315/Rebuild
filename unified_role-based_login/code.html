<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>RecruitSim - Role Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2463eb",
                        "background-light": "#f6f6f8",
                        "background-dark": "#111621",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .floating-shape {
            position: absolute;
            z-index: 0;
            filter: blur(60px);
            opacity: 0.4;
        }
        .shape-1 {
            top: 10%;
            left: 15%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #2463eb 0%, transparent 70%);
        }
        .shape-2 {
            bottom: 10%;
            right: 15%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #60a5fa 0%, transparent 70%);
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen relative overflow-x-hidden">
<!-- Background Elements -->
<div class="floating-shape shape-1"></div>
<div class="floating-shape shape-2"></div>
<div class="relative z-10 flex flex-col min-h-screen">
<!-- Navigation / Branding Header -->
<header class="w-full px-6 py-8 flex justify-center">
<div class="flex items-center gap-3">
<div class="bg-primary p-2 rounded-lg text-white shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-3xl block">rocket_launch</span>
</div>
<h1 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white">RecruitSim</h1>
</div>
</header>
<!-- Main Content -->
<main class="flex-1 flex items-center justify-center px-4 pb-20">
<div class="max-w-5xl w-full">
<div class="text-center mb-12"><h2 class="text-4xl font-bold text-slate-900 dark:text-white mb-4">Welcome Back</h2><p class="text-lg text-slate-600 dark:text-slate-400">Enter your credentials to access your dashboard</p></div>
<!-- Role Selection Grid -->
<div class="max-w-md mx-auto bg-white dark:bg-slate-800/50 backdrop-blur-sm border border-slate-200 dark:border-slate-700 p-8 rounded-xl shadow-xl">
<h3 class="text-2xl font-bold text-center mb-8 text-slate-900 dark:text-white">Sign in to RecruitSim</h3>
<form class="space-y-6">
<!-- Role Selector -->
<div class="space-y-2">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300">I am a...</label>
<select class="w-full px-4 py-3 rounded-[16px] border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all">
<option>Student</option>
<option>Admin</option>
<option>Judge</option>
<option>HR</option>
</select>
</div>
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Email Address</label>
<input class="w-full px-4 py-3 rounded-[16px] border border-slate-300 dark:border-slate-600 bg-transparent text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" placeholder="name@company.com" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block text-sm font-medium text-slate-700 dark:text-slate-300">Password</label>
<input class="w-full px-4 py-3 rounded-[16px] border border-slate-300 dark:border-slate-600 bg-transparent text-slate-900 dark:text-white focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" placeholder="••••••••" type="password"/>
</div>
<!-- Sign In Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-3 px-6 rounded-full transition-all shadow-lg shadow-primary/25 active:scale-[0.98]" type="submit">
            Sign In
        </button>
<!-- Forgot Password -->
<div class="text-center">
<a class="text-sm font-medium text-primary hover:underline" href="#">Forgot Password?</a>
</div>
</form>
</div>
<!-- Footer Links -->
<footer class="mt-16 text-center space-y-4">
<div class="flex flex-wrap justify-center gap-6 text-sm font-medium text-slate-500 dark:text-slate-400">
<a class="hover:text-primary transition-colors" href="#">Trouble logging in?</a>
<a class="hover:text-primary transition-colors" href="#">Request Platform Access</a>
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
</div>
<p class="text-xs text-slate-400 dark:text-slate-600">
                        © 2024 RecruitSim Technologies. All rights reserved.
                    </p>
</footer>
</div>
</main>
</div>
<!-- Background Images / Patterns -->
<div class="hidden">
<img class="opacity-10 pointer-events-none fixed inset-0 w-full h-full object-cover" data-alt="Subtle geometric triangle pattern overlay" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC8H2tlvrOD0veV2KkR-SI0wpwOZCA5f1Hw9A1N_4RL1jOWMeEaGQYjNuppJJjiAh4ulHw_ymeCdCMyU90-WHX8aUU4MYgghjD5xMMp0CQ66QwrAz1Rejo_oBNRFVv-DnWN-4RConw4LkWcUasXtjpMAzy5YWVUrmoe1ksNQ3yw0VPcWym4SFg9siFUpNkjSUpfFJk4XJv1AvcKtW8abVCP894PgcmtAypbAqjhwub7TbH7GsMuAG8-1CEXqzR0Y-JEtceUFkrRQS8"/>
</div>
</body></html>
